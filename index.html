  </a>
  <script>
  (function () {
    // The app's opening (OpeningOverlay.tsx), on the web.
    var SCENE_W = 320, SCENE_H = 660, EXTRA = 1040;          // the drawing is rendered with 1040 units of wall each side
    var LIT = { x: 160, y: 487.6 }, DOOR = { w: 60.72, h: 112 };
    var WALK_MS = 2200, FADE_IN_AT_MS = 1760, FADE_MS = 520, SKIP_FADE_MS = 180, MAX_ZOOM = 16, OVERSHOOT = 2.7;
    var NEXT = '/varco/';
    var enter = document.getElementById('enter'), walk = document.getElementById('walk'), scene = walk.querySelector('.scene');
    var word = document.getElementById('word'), hint = document.getElementById('hint'), fade = document.getElementById('fade');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var phase = 'waiting', geo, walkAnim, fadeAnim, fadeTimer;

    function layout() {
      var W = window.innerWidth, H = window.innerHeight;
      var tablet = Math.min(W, H) >= 600;                     // sceneFit: phones cover, larger screens fit the height
      var sc = tablet ? H / SCENE_H : Math.max(W / SCENE_W, H / SCENE_H);
      var offX = (W - SCENE_W * sc) / 2, offY = (H - SCENE_H * sc) / 2;
      scene.style.width = (2 * EXTRA + SCENE_W) * sc + 'px';
      scene.style.height = SCENE_H * sc + 'px';
      scene.style.left = offX - EXTRA * sc + 'px';
      scene.style.top = offY + 'px';
      // JF 10/22: "VARCO" much larger than in the app (38 scene units, was 13),
      // its baseline lowered toward the outer arch, letter spacing in proportion
      var WORD = 38, fs = WORD * sc, ls = WORD * 0.42 * sc, base = 76 + (WORD - 13) * 0.75;
      word.style.top = offY + base * sc - fs * 0.95 + 'px';
      word.style.fontSize = fs + 'px';
      word.style.lineHeight = fs * 1.2 + 'px';
      word.style.letterSpacing = ls + 'px';
      word.style.paddingLeft = ls + 'px';
      var k = Math.min(1.35, Math.max(1, W / 325));            // the app's useScale
      hint.style.bottom = 30.4 * k + 'px';
      hint.style.fontSize = 14.7 * k + 'px';
      var fill = Math.max(W / (DOOR.w * sc), H / (DOOR.h * sc));
      geo = { ox: offX + LIT.x * sc, oy: offY + LIT.y * sc, zoom: Math.max(MAX_ZOOM, fill * OVERSHOOT) };
      walk.style.transformOrigin = geo.ox + 'px ' + geo.oy + 'px';
    }

    function go() { window.location.href = NEXT; }
    function fadeToPaper(ms) {
      fadeAnim = fade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms, easing: 'cubic-bezier(0.55, 0.085, 0.68, 0.53)', fill: 'forwards' });
      fadeAnim.onfinish = function () { phase = 'arrived'; go(); };
    }

    function start(e) {
      if (e) e.preventDefault();
      if (phase === 'arrived') return;
      if (phase === 'walking') {                              // a second tap skips to the end
        if (walkAnim) walkAnim.pause();
        clearTimeout(fadeTimer);
        if (fadeAnim) fadeAnim.cancel();
        fadeToPaper(SKIP_FADE_MS);
        return;
      }
      phase = 'walking';
      hint.style.opacity = '0';
      if (reduce || !walk.animate) { fadeToPaper(FADE_MS); return; }
      walkAnim = walk.animate([{ transform: 'scale(1)' }, { transform: 'scale(' + geo.zoom + ')' }],
        { duration: WALK_MS, easing: 'cubic-bezier(0.42, 0, 0.9, 0.4)', fill: 'forwards' });
      fadeTimer = setTimeout(function () { fadeToPaper(FADE_MS); }, FADE_IN_AT_MS);
    }

    function reset() {                                        // coming back with the Back button
      phase = 'waiting'; clearTimeout(fadeTimer);
      if (walkAnim) walkAnim.cancel(); if (fadeAnim) fadeAnim.cancel();
      hint.style.opacity = '';
    }

    layout();
    window.addEventListener('resize', function () { if (phase === 'waiting') layout(); });
    enter.addEventListener('click', start);
    window.addEventListener('pageshow', function (e) { if (e.persisted) reset(); });
  })();
  </script>
</body>
</html>
